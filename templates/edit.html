{% extends 'base.html' %}

{% block title %}Edit Student &bull; {{ student.name }}{% endblock %}

{% block content %}
<div class="edit-container">
    <div class="edit-card card">
        <div class="card-header">
            <div class="back-link-wrapper">
                <a href="{{ url_for('index') }}" class="back-link">&larr; Back to Directory</a>
            </div>
            <h2>Update Student Details</h2>
            <p class="subtitle">Modify the records for <strong>{{ student.name }}</strong> (ID: {{ student.roll_no }}).</p>
        </div>

        <form action="{{ url_for('edit_student', id=student.id) }}" method="POST" class="student-form">
            <div class="form-group">
                <label for="roll_no">Roll Number / Student ID</label>
                <input type="text" id="roll_no" name="roll_no" value="{{ student.roll_no }}" required>
            </div>

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" value="{{ student.name }}" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" value="{{ student.email }}" required>
            </div>

            <div class="form-group">
                <label for="course">Course / Department</label>
                <input type="text" id="course" name="course" value="{{ student.course }}" required>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
